<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeWay – Lời mời</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="LifeWay">
<meta property="og:description" content="Bạn được mời kết nối trên LifeWay · You're invited to connect on LifeWay">
<style>
  :root { --bg:#F3FAF6; --surface:#FFFFFF; --fg:#10241A; --muted:#5E766A; --accent:#16A34A; --accent-dark:#15803D; --border:#E1EFE7; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:32px 24px; text-align:center; box-shadow:0 4px 12px rgba(11,93,42,.08); }
  .logo { width:64px; height:64px; margin:0 auto 16px; border-radius:16px; background:linear-gradient(135deg,#22C55E,#14B8A6); }
  h1 { margin:0 0 8px; font-size:1.4rem; }
  p { margin:0 0 20px; color:var(--muted); }
  .btn { display:block; width:100%; padding:14px 16px; margin-bottom:12px; border-radius:999px; border:0; font:600 1rem system-ui,sans-serif; text-decoration:none; cursor:pointer; }
  .primary { background:var(--accent); color:#fff; }
  .primary:hover { background:var(--accent-dark); }
  .ghost { background:transparent; color:var(--accent-dark); border:1px solid var(--border); }
  .code-box { margin:24px 0 8px; padding:12px; border:1px dashed var(--accent); border-radius:14px; font:700 1.4rem ui-monospace,Menlo,Consolas,monospace; letter-spacing:.12em; color:var(--accent-dark); word-break:break-all; }
  .hint { font-size:.85rem; margin-bottom:0; }
  .hidden { display:none; }
  .error { color:#E5484D; }
</style>
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true"></div>
  <h1 id="title"></h1>
  <p id="subtitle"></p>

  <div id="ok">
    <a id="open" class="btn primary" href="#"></a>
    <a id="store" class="btn ghost" href="#"></a>
    <div class="code-box" id="code"></div>
    <button id="copy" class="btn ghost" type="button"></button>
    <p class="hint" id="hint"></p>
  </div>

  <p id="bad" class="error hidden"></p>
</main>

<script>
(function () {
  var PKG = 'com.htkycong.lifeway';
  var PLAY = 'https://play.google.com/store/apps/details?id=' + PKG;
  var APP_STORE = ''; // TODO: điền link App Store khi app iOS lên store

  var T = {
    vi: {
      title: 'Bạn được mời kết nối trên LifeWay',
      subtitle: 'Một người thân muốn kết nối với bạn trên LifeWay để nhắn tin, gửi ảnh, chia sẻ tâm trạng và cùng nhau trên “chuyến xe cuộc đời”.',
      open: 'Mở trong ứng dụng LifeWay',
      play: 'Tải LifeWay trên Google Play',
      appstore: 'Tải LifeWay trên App Store',
      copy: 'Sao chép mã kết nối',
      copied: 'Đã sao chép ✓',
      hint: 'Chưa có app? Tải về, đăng nhập, vào tab Người thân → Kết nối người thân, nhập mã này rồi bấm ➜. Khi người thân đồng ý, hai bạn được kết nối.',
      bad: 'Link mời không hợp lệ. Hãy nhờ người thân gửi lại link mới.'
    },
    en: {
      title: "You're invited to connect on LifeWay",
      subtitle: 'Someone close to you wants to connect on LifeWay to chat, share photos and moods, and ride “life’s journey” together.',
      open: 'Open in the LifeWay app',
      play: 'Get LifeWay on Google Play',
      appstore: 'Get LifeWay on the App Store',
      copy: 'Copy connection code',
      copied: 'Copied ✓',
      hint: "Don't have the app yet? Install it, sign in, go to Loved ones → Connect with loved ones, enter this code and tap ➜. Once your loved one approves, you're connected.",
      bad: 'This invite link is not valid. Ask your loved one to send a new one.'
    }
  };
  var lang = (navigator.language || 'en').toLowerCase().indexOf('vi') === 0 ? 'vi' : 'en';
  var t = T[lang];
  document.documentElement.lang = lang;
  function $(id) { return document.getElementById(id); }

  $('title').textContent = t.title;
  $('subtitle').textContent = t.subtitle;

  // Permanent codes are 6 letters/digits (e.g. K7M2QX); older one-time invites are 6 digits.
  var code = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!/^[A-Z0-9]{6}$/.test(code)) {
    $('ok').classList.add('hidden');
    $('bad').textContent = t.bad;
    $('bad').classList.remove('hidden');
    return;
  }

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var deepLink = 'lifeway://invite?c=' + encodeURIComponent(code);
  // On Android, an intent URL opens the app if installed, otherwise falls back to Google Play.
  var openHref = isAndroid
    ? 'intent://invite?c=' + encodeURIComponent(code) + '#Intent;scheme=lifeway;package=' + PKG +
      ';S.browser_fallback_url=' + encodeURIComponent(PLAY) + ';end'
    : deepLink;

  $('open').textContent = t.open;
  $('open').href = openHref;

  var storeUrl = isIOS ? APP_STORE : PLAY;
  if (storeUrl) {
    $('store').textContent = isIOS ? t.appstore : t.play;
    $('store').href = storeUrl;
  } else {
    $('store').classList.add('hidden');
  }

  // Shown as "K7M 2QX" for easy reading; the copy button copies it without the space.
  $('code').textContent = code.slice(0, 3) + ' ' + code.slice(3);
  $('hint').textContent = t.hint;
  $('copy').textContent = t.copy;
  $('copy').addEventListener('click', function () {
    var done = function () { $('copy').textContent = t.copied; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, function () {});
    } else {
      var r = document.createRange(); r.selectNodeContents($('code'));
      var s = getSelection(); s.removeAllRanges(); s.addRange(r);
      try { document.execCommand('copy'); done(); } catch (e) {}
    }
  });
})();
</script>
</body>
</html>
